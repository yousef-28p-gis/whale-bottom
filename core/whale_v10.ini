# الأصل: FET/USDT — تم التحقق على 13 عملة إضافية
# الحالة: ✅ جاهزة للتداول الحي (Paper Trading أولاً)

[STRATEGY]
name = "Whale Strategy v10 — DCA 25/75 + Profit Lock 60%"
version = 10
asset = "FET/USDT"
timeframe = "15m"
direction = "LONG only"
status = "VERIFIED — OOS + Walk-Forward + Multi-Asset"

[WHALE_INDICATOR]
lookback = 200
description = "يكتشف التجميع عند أدنى 200 شمعة"
spike_condition = "whale > whale[1] AND whale[1] <= 0.02"
wma_fast = 20
wma_slow = 50
wma_condition = "WMA20(whale) > WMA50(whale)"
strength_period = 50
strength_min = 50  # % من الذروة

[ENTRY_FILTERS]
volume_multiplier = 1.5
volume_period = 20
price_filter = "close > SMA50(daily)"

[POSITION_MANAGEMENT]
mode = "DCA"
entry1_pct = 25
entry2_pct = 75
entry2_trigger = "قاع سوينج جديد (5-bar fractal) أقل من سعر الدخول الأول"
weighted_average = "(entry1 × 25 + entry2 × 75) / 100"

[EXIT]
tp_mode = "EMA21"
tp_source = "EMA21 PREVIOUS bar — NO look-ahead"
sl_mode = "Trailing Swing Low"
sl_fractal = 5
sl_multiplier = 0.998
sl_direction_check = "if SL > avg_entry: check high >= SL | if SL < avg_entry: check low <= SL"

[PROFIT_LOCK]
enabled = true
activation_pct = 60  # % من مسافة TP
trail_pct = 0.3  # % تحت أعلى سعر
description = "عند وصول السعر لـ 60% من TP، فعّل trailing stop 0.3%"

[TIME_EXIT]
max_hours = 4
max_bars = 16  # على فريم 15 دقيقة

[SELL_SIGNAL]
enabled = true
conditions = 6  # توزيع، كسر وهمي، ابتلاع، إغراق حوت، BOS، تباعد RSI
threshold = 60  # % من الشروط

[RISK]
monthly_loss_limit_pct = 7
fee_pct = 0.1  # لكل صفقة (0.2% ذهاب وإياب)
capital_per_trade_pct = 100  # بعد التعزيز

